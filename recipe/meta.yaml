{% set name = "pyautogen" %}
{% set version = "1.0.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/ag2ai/ag2/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 348b2c6d6caa06a9721f6a7bb6a8ec5075a734b489ccfc380890c9ebfdbf982f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - hatchling
    - pip
    - uv-build >=0.9.2,<0.12
  run:
    - python
    - termcolor
    - python-dotenv
    - tiktoken
    - pydantic >=2.6.1,<3
    - pyyaml >=6.0.2
    - packaging
    - httpx >=0.28.1,<1
    - anyio >=4.0.0,<5.0.0
    # for beta tools
    - fast-depends >=3.0.8,<4.0.0
  run_constrained:
    # a2a
    - a2a-sdk >=1.1.0,<2
    # a2ui
    - jsonschema >=4.18.0,<5
    - starlette >=0.40,<2
    # acp
    - agent-client-protocol >=0.12.0,<0.13
    - starlette >=0.40,<2
    - uvicorn >=0.51.0,<1
    # ag-ui
    - ag-ui-protocol >=0.1.15,<0.2
    # openai
    - openai >=2.45.0,<3.0
    # anthropic
    - anthropic >=0.116.0,<1
    # gemini
    - google-genai >=1.68.0,<3.0
    # elevenlabs
    - elevenlabs >=1.50.0,<3
    # xai
    - xai-sdk >=1.12.2,<2
    # zai
    - zai-sdk >=0.2.3,<1
    # mistral
    - mistralai >=2.8.0,<3
    # ollama
    - ollama >=0.4.7
    - fix_busted_json >=0.0.18
    # bedrock
    - boto3 >=1.34.149
    # dashscope
    - dashscope >=1.25.13
    # redis
    - redis >=5.0,<9
    # tracing
    - opentelemetry-sdk >=1.20
    - opentelemetry-exporter-otlp-proto-grpc >=1.20
    # metrics
    - prometheus-client >=0.20.0,<0.30.0
    # # flaml
    # - numpy >=2.1  # [py>=313]
    # - numpy>=1.24.0,<2.0.0  # [py<313]
    # tavily
    - tavily-python >=0.7.4,<0.8
    # ddgs
    - ddgs >=9.0.0,<10
    # perplexity
    - perplexityai >=0.30.0,<1
    # mcp
    - mcp >=1.11.0,<2
    # mcp-ui
    - mcp-ui-server >=1.0.0

test:
  imports:
    - ag2
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://ag2.ai
  dev_url: https://github.com/ag2ai/ag2
  doc_url: https://docs.ag2.ai
  summary: A programming framework for agentic AI
  description: |
    AG2 (distributed on PyPI as ag2) is a programming framework for building
    multi-agent and agentic AI applications.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
